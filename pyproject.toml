[project]
name = "pythonproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "mlflow==3.17.2",
    "numpy==2.1.2",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "tensorflow==2.21.0",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3.3.260113",
    "ruff>=0.17.3",
    "scikit-learn-stubs>=0.0.3",
    "types-tensorflow>=2.18.0.20261009",
]

[tool.mypy]
python_version = "3.10"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
